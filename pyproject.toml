[project]
name = "researchit-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aryan Shah", email = "aryanrshah2109@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.10",
    "from-root>=1.3.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "langchain-typesafe>=0.0.1a3",
    "langgraph>=1.2.12",
    "langsmith>=0.14.1",
    "laya>=0.4.8",
    "pydantic>=2.13.5",
    "ragas>=0.4.3",
    "streamlit>=1.64.0",
    "tavily>=1.1.0",
    "tavily-python>=0.8.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
researchit-ai = "researchit_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
